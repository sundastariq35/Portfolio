<style>
  :root{
    --bg:#07231b;
    --bg2:#0c3226;
    --surface:rgba(244,236,219,.04);
    --border:rgba(232,176,75,.22);
    --border-soft:rgba(244,236,219,.10);
    --text:#f4ecdb;
    --text-dim:#c3d2c8;
    --muted:#8aa198;
    --accent:#e8b04b;
    --accent-soft:rgba(232,176,75,.14);
    --mint:#8fdcb9;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg); height:100%;}
  body{
    margin:0; color:var(--text);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    scroll-behavior:smooth;
  }
  @media (prefers-reduced-motion: reduce){
    body{ scroll-behavior:auto; }
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  h1,h2,h3{font-family:'Fraunces',ui-serif,Georgia,serif; margin:0; font-weight:700;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--accent); color:#0b2a20;}

  /* ambient background */
  .aurora{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1000px 640px at var(--mx,20%) var(--my,-10%), rgba(232,176,75,.14), transparent 60%),
      radial-gradient(900px 700px at 90% 30%, rgba(143,220,185,.10), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    transition:background-position .6s ease;
  }

  /* progress bar */
  .progress{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:linear-gradient(90deg, var(--accent), var(--mint));
    z-index:100; transition:width .08s linear;
  }

  /* top bar */
  header.top{
    position:fixed; top:0; left:0; right:0; z-index:90;
    padding-top:env(safe-area-inset-top,0px);
    display:flex; align-items:center; justify-content:space-between;
    padding-inline:22px; padding-block:14px;
    pointer-events:none;
  }
  header.top .brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Fraunces',serif; font-weight:700; font-size:1rem;
    pointer-events:auto;
    background:rgba(7,35,27,.55); backdrop-filter:blur(8px);
    border:1px solid var(--border-soft); padding:8px 14px; border-radius:999px;
  }
  header.top .brand .mark{
    width:24px; height:24px; border-radius:50%;
    background:linear-gradient(155deg, var(--accent), #b9832e);
    display:flex; align-items:center; justify-content:center;
    color:#241505; font-weight:800; font-size:.7rem;
  }
  header.top .counter{
    font-family:'JetBrains Mono',monospace; font-size:.72rem; letter-spacing:.05em;
    color:var(--text-dim); background:rgba(7,35,27,.55); backdrop-filter:blur(8px);
    border:1px solid var(--border-soft); padding:8px 14px; border-radius:999px;
    pointer-events:auto;
  }
  header.top .counter b{ color:var(--accent); }

  /* right dot nav */
  nav.dots{
    position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:90;
    display:flex; flex-direction:column; gap:14px;
  }
  @media (max-width:680px){ nav.dots{ display:none; } }
  nav.dots button{
    all:unset; cursor:pointer; position:relative;
    width:9px; height:9px; border-radius:50%;
    background:var(--border-soft); border:1px solid var(--border-soft);
    transition:background .25s, transform .25s, border-color .25s;
  }
  nav.dots button.active{ background:var(--accent); border-color:var(--accent); transform:scale(1.3); }
  nav.dots button .tip{
    position:absolute; right:20px; top:50%; transform:translateY(-50%);
    font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.03em;
    color:var(--text); background:rgba(7,35,27,.9); border:1px solid var(--border-soft);
    padding:4px 10px; border-radius:6px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .18s;
  }
  nav.dots button:hover .tip{ opacity:1; }

  /* deck */
  main{ position:relative; z-index:1; }
  .slide{
    position:relative;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:100px 20px 64px;
    scroll-margin-top:0;
    overflow:hidden;
  }
  .slide-content{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    gap:22px; width:100%;
  }
  .bg-layer{
    position:absolute; inset:0; z-index:0;
    pointer-events:none; overflow:hidden;
  }
  .bgicon-pos{
    position:absolute; will-change:transform;
  }
  .bgicon-inner{
    display:block;
    animation-name:bgfloat;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  @keyframes bgfloat{
    0%,100%{ transform:translateY(0) rotate(var(--r0,0deg)); }
    50%{ transform:translateY(-16px) rotate(var(--r1,6deg)); }
  }
  .bgicon-inner svg{ display:block; }
  .frame{
    max-width:920px; width:100%;
    aspect-ratio:2600/1463;
    border-radius:18px; overflow:hidden;
    border:1px solid var(--border-soft);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.65);
    background:#04140f;
    opacity:0; transform:translateY(46px) scale(.96);
    transition:opacity .9s cubic-bezier(.16,.8,.24,1), transform .9s cubic-bezier(.16,.8,.24,1);
  }
  .slide.in-view .frame{ opacity:1; transform:translateY(0) scale(1); }
  .frame img{ width:100%; height:100%; object-fit:cover; }

  .caption{
    max-width:920px; width:100%;
    display:flex; flex-direction:column; align-items:flex-start; gap:16px;
    opacity:0; transform:translateY(16px);
    transition:opacity .8s ease .12s, transform .8s ease .12s;
  }
  .slide.in-view .caption{ opacity:1; transform:translateY(0); }
  .caption .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:.72rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); display:inline-flex; align-items:center; gap:10px;
  }
  .caption .eyebrow::before{ content:""; width:22px; height:1px; background:var(--accent); display:inline-block; }
  .caption h2{ font-size:clamp(1.2rem,2.4vw,1.6rem); margin-top:6px; color:var(--text); }
  .caption .idx{
    font-family:'JetBrains Mono',monospace; font-size:.8rem; color:var(--muted);
    border:1px solid var(--border-soft); padding:6px 12px; border-radius:999px; flex:none;
  }
  .caption .head-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; width:100%; }

  .blurb,.panel,.tag-row,.preview-list,.swatches{
    opacity:0; transform:translateY(16px);
    transition:opacity .8s ease .18s, transform .8s ease .18s;
  }
  .slide.in-view .blurb,
  .slide.in-view .panel,
  .slide.in-view .tag-row,
  .slide.in-view .preview-list,
  .slide.in-view .swatches{ opacity:1; transform:translateY(0); }
  .slide.in-view .panel{ transition-delay:.26s; }
  .slide.in-view .tag-row{ transition-delay:.32s; }
  .slide.in-view .preview-list{ transition-delay:.26s; }

  .blurb{
    max-width:900px; width:100%; margin-top:2px;
    color:var(--text-dim); font-size:1rem; line-height:1.7;
  }
  .blurb b{ color:var(--text); font-weight:600; }

  .panel{
    max-width:920px; width:100%;
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    margin-top:6px;
  }
  @media (max-width:640px){ .panel{ grid-template-columns:1fr; } }
  .panel .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:14px;
    padding:16px 18px;
  }
  .panel .card .k{
    font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--accent);
  }
  .panel .card .v{ margin-top:6px; color:var(--text); font-size:.92rem; line-height:1.55; }
  .panel .card.span2{ grid-column:1 / -1; }

  .swatches{ display:flex; gap:8px; margin-top:8px; }
  .swatches i{ width:22px; height:22px; border-radius:6px; display:inline-block; border:1px solid rgba(255,255,255,.15); }

  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; max-width:920px; width:100%; }
  .tag-row .tag{
    font-family:'JetBrains Mono',monospace; font-size:.72rem;
    color:var(--muted); background:rgba(244,236,219,.05); border:1px solid var(--border-soft);
    padding:5px 11px; border-radius:6px;
  }

  .preview-list{
    max-width:920px; width:100%; display:flex; flex-direction:column; gap:0;
    border-top:1px solid var(--border-soft);
  }
  .preview-list .prow{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--border-soft);

  .preview-list .prow .pname{ font-weight:600; color:var(--text); font-size:.95rem; }
  .preview-list .prow .pnum{ font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:.78rem; }

  /* first slide extra: scroll cue */
  .scroll-cue{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.1em;
    color:var(--muted); text-transform:uppercase;
    animation:bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translate(-50%,0);} 50%{transform:translate(-50%,8px);} }
  .scroll-cue svg{ width:16px; height:16px; }

  /* contact block on final slide */
  .contact-cta{
    max-width:920px; width:100%; display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
    opacity:0; transform:translateY(16px); transition:opacity .8s ease .2s, transform .8s ease .2s;
  }
  .slide.in-view .contact-cta{ opacity:1; transform:translateY(0); }
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:.86rem;
    padding:12px 22px; border-radius:999px; border:1px solid var(--accent);
    color:#241505; background:var(--accent); text-decoration:none;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 26px -10px rgba(232,176,75,.55); }
  .btn.ghost{ background:transparent; color:var(--text); border-color:var(--border-soft); }
  .btn.ghost:hover{ border-color:var(--accent); color:var(--accent); box-shadow:none; }

  footer.end{
    text-align:center; padding:40px 20px calc(56px + env(safe-area-inset-bottom,0px));
    color:var(--muted); font-size:.8rem; position:relative; z-index:1;
  }

  .to-top{
    position:fixed;
    right:18px;
    bottom:calc(22px + env(safe-area-inset-bottom,0px));
    z-index:95;
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#241505; border:1px solid var(--accent);
    cursor:pointer;
    opacity:0; transform:translateY(14px) scale(.9);
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease, box-shadow .2s ease;
    box-shadow:0 14px 30px -12px rgba(0,0,0,.55);
  }
  .to-top.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .to-top:hover{ box-shadow:0 16px 34px -10px rgba(232,176,75,.55); }
  .to-top svg{ width:20px; height:20px; }
  @media (max-width:680px){ .to-top{ right:14px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); } }
</style>

    { file:"pages/slide-25.jpg", cat:"Print", title:"Print Design", icons:["poster","printer","ticket"],
      blurb:"Posters, flyers, panaflex boards and standees designed for real print production — not just screen mockups.",
      preview:["Flying Birds School","Al Maknaan Catalogue","Ann Home Kitchen Menu"] },

    { file:"pages/slide-26.jpg", cat:"Print", title:"Flying Birds School", icons:["bird","poster","bowl"],
      blurb:"A full admissions season for Flying Birds School — standees, panaflex boards and flyers — plus two side projects: a product catalogue for Al Maknaan Foods and a tri-fold menu for Ann Home Kitchen.",
      panel:[
        {k:"Flying Birds School", v:"Admissions standees, panaflex, flyers, summer-camp certificate"},
        {k:"Al Maknaan Catalogue", v:"Soft packs, baking range, food colours & essence"},
        {k:"Ann Home Kitchen", v:"Illustrated tri-fold menu — mains, burgers, rolls, baking, cakes", span:true}
      ] },

    { file:"pages/slide-27.jpg", cat:"Thank You", title:"Thank You", icons:["heart","star","mail","sparkle"],
      blurb:"Have a product, brand, or campaign that needs to look this good? Let's talk about it.",
      contact:true }
  ];

  var deck = document.getElementById('deck');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ICONS = {
    sparkle:'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>',
    star:'<path d="M12 3l2.6 5.9 6.4.6-4.8 4.3 1.4 6.2L12 16.9 6.4 20l1.4-6.2-4.8-4.3 6.4-.6L12 3Z"/>',
    gift:'<path d="M4 9h16v11H4z"/><path d="M4 9V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M12 4v16M12 4c-1.5-2-5-2-5 0s3.5 2 5 0c1.5 2 5 2 5 0s-3.5-2-5 0Z"/>',
    swirl:'<path d="M12 2a10 10 0 1 0 8.66 5M12 2v6l4-3"/>',
    brush:'<path d="M4 20c0-4 2-6 6-7l8-8 3 3-8 8c-1 4-3 6-7 6a3 3 0 0 1-2-2Z"/>',
    palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-1 2-2 0-.6-.3-1-.6-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.5-9-7.5Z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15.5" cy="8" r="1"/>',
    swatch:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    leaf:'<path d="M20 4C10 4 4 10 4 18v2h2c8 0 14-6 14-16Z"/><path d="M6 20c4-4 8-8 14-14"/>',
    badge:'<circle cx="12" cy="9" r="6"/><path d="M9 14.5 7 22l5-3 5 3-2-7.5"/>',
    shield:'<path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6Z"/>',
    cross:'<path d="M12 4v16M4 12h16"/>',
    truck:'<path d="M2 8h11v8H2zM13 11h4l3 3v2h-7z"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
    road:'<path d="M9 3 4 21M15 3l5 18M12 8v2M12 13v2M12 18v1"/>',
    box:'<path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
    jar:'<path d="M8 2h8v3H8z"/><path d="M7 5h10l1 4v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9Z"/>',
    pouch:'<path d="M6 9c0-3 2.5-6 6-6s6 3 6 6l1 10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3Z"/><path d="M9 12h6"/>',
    hexagon:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9Z"/>',
    bowl:'<path d="M3 11h18a9 6 0 0 1-18 0Z"/><path d="M7 11c0-3 2-5 5-5s5 2 5 5"/>',
    chip:'<path d="M12 2c4 3 7 8 7 12a7 7 0 0 1-14 0c0-4 3-9 7-12Z"/>',
    heart:'<path d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.4 12 21 12 21Z"/>',
    chat:'<path d="M4 5h16v11H8l-4 4Z"/>',
    share:'<circle cx="6" cy="12" r="2.4"/><circle cx="17" cy="6" r="2.4"/><circle cx="17" cy="18" r="2.4"/><path d="M8.2 10.8 14.8 7.2M8.2 13.2l6.6 3.6"/>',
    poster:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    printer:'<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M6 17h12v4H6z"/>',
    ticket:'<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><path d="M10 6v12"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    plane:'<path d="M2 16l20-8-8 20-2-8-8-2Z"/>',
    cap:'<path d="M12 4 2 9l10 5 10-5Z"/><path d="M6 11.5V17c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/>',
    bird:'<path d="M3 12c3-6 8-8 12-6-2 0-3 1-3 2 4 0 7 2 9 5-2-1-3-1-4 0 1 4-3 7-8 7-2 0-4-1-5-2 2 0 3-1 3-2-3 0-4-2-4-4Z"/>',
    chart:'<path d="M4 20V10M11 20V4M18 20v-7"/>'
  };

  function svgIcon(key){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[key] || ICONS.star) + '</svg>';
  }

  function buildBg(sec, keys){
    if(!keys || !keys.length) return;
    var layer = document.createElement('div');
    layer.className = 'bg-layer';
    var colors = ['var(--accent)','var(--mint)'];
    var count = Math.max(keys.length, 4);
    for(var n=0; n<count; n++){
      var key = keys[n % keys.length];
      var pos = document.createElement('div');
      pos.className = 'bgicon-pos';
      var size = 46 + Math.random()*90;
      var left = 4 + Math.random()*88;
      var top = 6 + Math.random()*82;
      var depth = (0.14 + Math.random()*0.26).toFixed(2);
      var rot0 = (Math.random()*30-15).toFixed(1);
      var rot1 = (parseFloat(rot0) + (Math.random()*16-8)).toFixed(1);
      var opacity = (0.06 + Math.random()*0.08).toFixed(2);
      pos.style.left = left + '%';
      pos.style.top = top + '%';
      pos.style.width = size + 'px';
      pos.style.height = size + 'px';
      pos.style.color = colors[n % 2];
      pos.style.opacity = opacity;
      pos.dataset.depth = depth;

      var inner = document.createElement('div');
      inner.className = 'bgicon-inner';
      inner.style.setProperty('--r0', rot0 + 'deg');
      inner.style.setProperty('--r1', rot1 + 'deg');
      if(!reduceMotion){
        inner.style.animationDuration = (7 + Math.random()*7).toFixed(1) + 's';
        inner.style.animationDelay = (Math.random()*4).toFixed(1) + 's';
      } else {
        inner.style.animation = 'none';
      }
      inner.innerHTML = svgIcon(key);
      pos.appendChild(inner);
      layer.appendChild(pos);
    }
    sec.appendChild(layer);
  }

  function renderPanel(items){
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    items.forEach(function(it){
      var card = document.createElement('div');
      card.className = 'card' + (it.span ? ' span2' : '');
      card.innerHTML = '<div class="k">' + it.k + '</div><div class="v">' + it.v + '</div>';
      wrap.appendChild(card);
    });
    return wrap;
  }

  slides.forEach(function(s, i){
    var sec = document.createElement('section');
    sec.className = 'slide';
    sec.id = 'slide-' + (i+1);
    sec.dataset.cat = s.cat;
    sec.dataset.idx = i+1;

    buildBg(sec, s.icons);

    var content = document.createElement('div');
    content.className = 'slide-content';

    var frame = document.createElement('div');
    frame.className = 'frame';
    var img = document.createElement('img');
    img.src = s.file;
    img.loading = i < 2 ? 'eager' : 'lazy';
    if(i === 0){ img.setAttribute('fetchpriority', 'high'); }
    img.alt = s.title;
    frame.appendChild(img);
    content.appendChild(frame);

    var cap = document.createElement('div');
    cap.className = 'caption';
    cap.innerHTML =
      '<div class="head-row"><div><span class="eyebrow">' + s.cat + '</span><h2>' + s.title + '</h2></div>' +
      '<span class="idx">' + String(i+1).padStart(2,'0') + ' / 27</span></div>';
    content.appendChild(cap);

    if(s.blurb){
      var b = document.createElement('p');
      b.className = 'blurb';
      b.innerHTML = s.blurb;
      content.appendChild(b);
    }

    if(s.swatches){
      var sw = document.createElement('div');
      sw.className = 'swatches';
      sw.style.maxWidth = '920px'; sw.style.width = '100%';
      s.swatches.forEach(function(c){
        var i2 = document.createElement('i');
        i2.style.background = c;
        i2.title = c;
        sw.appendChild(i2);
      });
      content.appendChild(sw);
    }

    if(s.panel){ content.appendChild(renderPanel(s.panel)); }

    if(s.preview){
      var pl = document.createElement('div');
      pl.className = 'preview-list';
      s.preview.forEach(function(name, idx){
        var row = document.createElement('div');
        row.className = 'prow';
        row.innerHTML = '<span class="pname">' + name + '</span><span class="pnum">' + String(idx+1).padStart(2,'0') + '</span>';
        pl.appendChild(row);
      });
      content.appendChild(pl);
    }

    if(s.tags){
      var tr = document.createElement('div');
      tr.className = 'tag-row';
      s.tags.forEach(function(t){
        var tg = document.createElement('span');
        tg.className = 'tag';
        tg.textContent = t;
        tr.appendChild(tg);
      });
      content.appendChild(tr);
    }

    if(s.contact){
      var cta = document.createElement('div');
      cta.className = 'contact-cta';
      cta.innerHTML =
        '<a class="btn" href="https://wa.me/92309210121" target="_blank" rel="noopener">Message on WhatsApp</a>' +
        '<a class="btn ghost" href="mailto:sundastariq35@gmail.com">sundastariq35@gmail.com</a>' +
        '<a class="btn ghost" href="https://behance.net/sundastariq35" target="_blank" rel="noopener">Behance</a>';
      content.appendChild(cta);
    }

    sec.appendChild(content);
    deck.appendChild(sec);
  });

  // dot nav — one dot per category, first occurrence
  var dotsEl = document.getElementById('dots');
  var seen = {};
  var groups = [];
  slides.forEach(function(s, i){
    if(!seen[s.cat]){ seen[s.cat] = true; groups.push({cat:s.cat, idx:i}); }
  });
  groups.forEach(function(g){
    var btn = document.createElement('button');
    btn.dataset.cat = g.cat;
    var tip = document.createElement('span');
    tip.className = 'tip';
    tip.textContent = g.cat;
    btn.appendChild(tip);
    btn.addEventListener('click', function(){
      document.getElementById('slide-' + (g.idx+1)).scrollIntoView({behavior:'smooth'});
    });
    dotsEl.appendChild(btn);
  });

  var dotButtons = dotsEl.querySelectorAll('button');
  function setActiveDot(cat){
    dotButtons.forEach(function(b){ b.classList.toggle('active', b.dataset.cat === cat); });
  }

  var curIdxEl = document.getElementById('curIdx');
  var sections = Array.prototype.slice.call(document.querySelectorAll('.slide'));

  var activeSections = new Set();

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        activeSections.add(entry.target);
      } else {
        activeSections.delete(entry.target);
      }
      if(entry.isIntersecting && entry.intersectionRatio > 0.5){
        setActiveDot(entry.target.dataset.cat);
        curIdxEl.textContent = String(entry.target.dataset.idx).padStart(2,'0');
      }
    });
  }, {threshold:[0, 0.5], rootMargin:'20% 0px 20% 0px'});
  sections.forEach(function(sec){ io.observe(sec); });

  // progress bar + subtle aurora drift tied to scroll
  var progress = document.getElementById('progress');
  var aurora = document.getElementById('aurora');
  var ticking = false;

  function updateParallax(){
    var vh = window.innerHeight;
    activeSections.forEach(function(sec){
      var rect = sec.getBoundingClientRect();
      var raw = (vh - rect.top) / (vh + rect.height);
      var progressLocal = Math.min(1, Math.max(0, raw));
      var icons = sec.querySelectorAll('.bgicon-pos');
      for(var k=0; k<icons.length; k++){
        var ic = icons[k];
        var depth = parseFloat(ic.dataset.depth) || 0.2;
        var ty = (progressLocal - 0.5) * depth * 320;
        ic.style.transform = 'translate3d(0,' + ty.toFixed(1) + 'px,0)';
      }
    });
  }

  var toTop = document.getElementById('toTop');

  function onScroll(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var pct = h > 0 ? (window.scrollY / h) * 100 : 0;
    progress.style.width = pct + '%';
    aurora.style.setProperty('--mx', (10 + pct * 0.5) + '%');
    aurora.style.setProperty('--my', (-10 + pct * 0.35) + '%');
    toTop.classList.toggle('show', window.scrollY > window.innerHeight * 0.6);
    if(!reduceMotion){
      if(!ticking){
        window.requestAnimationFrame(function(){ updateParallax(); ticking = false; });
        ticking = true;
      }
    }
  }
  toTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior: reduceMotion ? 'auto' : 'smooth'});
  });
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  // keyboard up/down jumps between slides
  window.addEventListener('keydown', function(e){
    if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var current = sections.findIndex(function(s){
      var r = s.getBoundingClientRect();
      return r.top <= window.innerHeight/2 && r.bottom >= window.innerHeight/2;
    });
    if(current === -1) return;
    var next = e.key === 'ArrowDown' ? Math.min(current+1, sections.length-1) : Math.max(current-1, 0);
    sections[next].scrollIntoView({behavior:'smooth'});
    e.preventDefault();
  });
})();
</script>
